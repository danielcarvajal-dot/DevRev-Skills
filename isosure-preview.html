<!DOCTYPE html>
<html lang="en">
<head>

    .logo { height: 72px; width: auto; display: block; cursor: pointer; }
    nav { display: flex; gap: 1.1rem; color: var(--muted); font-size: .92rem; font-weight: 500; }
    nav a:hover { color: var(--purple); }
    .actions { display: flex; gap: .5rem; align-items: center; }
    .btn {
      border: 0; border-radius: 8px; padding: .55rem 1rem; cursor: pointer;

    }
    .btn.ghost { background: #fff; color: var(--purple); border: 1px solid var(--line); }
    .btn.mid { background: var(--purple-mid); }
    .btn.danger { background: var(--danger); }
    .badge {
      background: var(--purple-mid); color: #fff; border-radius: 999px; min-width: 1.2rem;

    main { flex: 1; width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 1.6rem 0 3rem; }
    footer { background: var(--purple-deep); color: #fff; padding: 2rem 1.25rem; }

    @media (max-width: 799px) { nav { display: none; } .logo { height: 56px; } }

    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; }

    .row { display: flex; justify-content: space-between; gap: .8rem; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; gap: .75rem; }
    .hero {

    .alert { border-radius: 10px; padding: .85rem 1rem; margin: .5rem 0; }
    .alert.warn { background: #fff8eb; border: 1px solid #e6c37a; }

    .forms { display: flex; gap: .4rem; flex-wrap: wrap; }
    .forms button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: .45rem .8rem; cursor: pointer; }

  </style>
</head>

function emptyWizard() {
  return {draftId:crypto.randomUUID(),step:"patient",q:"",medq:"",family:"",productId:"",doseId:"",directions:"",quantity:"",unit:"",refills:0,daw:false,notes:"",doseAmount:"",volumeMl:"",ack:[],adding:false};
}
function familyOf(p) {
  return p.family || (p.shortName||p.name).replace(/\s+(Cream|Gel|Capsules?|Troches?|Suspension|Nasal spray|Topical|Compound|Spray|Injection|Suppositor(?:y|ies))$/i,"").trim();
}
function isInjection(p) { return /inject/i.test(p.form||""); }
function dobFmt(iso) {
  if (!iso) return "—";
  const [y,m,d] = String(iso).split("-");
  return y && m && d ? `${m}/${d}/${y}` : iso;
}
function greetingName(name) {
  const cleaned = String(name||"").replace(/,?\s*(MD|DO|NP|PA-C|PA|RPh|PharmD)\.?$/i,"").trim();
  const parts = cleaned.split(/\s+/);
  if (parts.length>=2 && /^dr\.?$/i.test(parts[0])) return "Dr. " + parts[parts.length-1];
  return cleaned || "Doctor";
}
function timeGreeting() {
  const h = new Date().getHours();
  return h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening";
}

const money = (n) => (Number(n)||0).toLocaleString("en-US",{style:"currency",currency:"USD"});
const product = (id) => state.products.find(p => p.id === id);
const doseOf = (p, id) => p.doses.find(d => d.id === id);

let state = { user:null, cart:[], orders:[], products: DEFAULT_PRODUCTS, patients:[], drafts:[], scripts:[], selections:{}, documents:[], notifications:[], refills:[], ingredients:[], lots:[], mfrs:[], crs:[], envLogs:[], equipmentLogs:[], csLogs:[], wizard: emptyWizard() };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(PREV_KEY) || "{}");
  state = Object.assign(state, saved, { selections: saved.selections || {}, wizard: saved.wizard || emptyWizard() });
  if (!state.products?.length) state.products = DEFAULT_PRODUCTS;
  DEFAULT_PRODUCTS.forEach(p => { if (!state.products.some(x => x.id===p.id)) state.products.push(p); });
  const defaultById = Object.fromEntries(DEFAULT_PRODUCTS.map(p => [p.id, p]));
  state.products = state.products.map(p => ({
    ...p,
    category: defaultById[p.id] ? defaultById[p.id].category : normalizeCategory(p.category, p.id)
  }));
  state.patients = state.patients || [];
  state.drafts = state.drafts || [];
  state.documents = state.documents || [];
  state.notifications = state.notifications || [];
  state.refills = state.refills || [];
  state.ingredients = state.ingredients || [];
  state.lots = state.lots || [];
  state.mfrs = state.mfrs || [];
  state.crs = state.crs || [];
  state.envLogs = state.envLogs || [];
  state.equipmentLogs = state.equipmentLogs || [];
  state.csLogs = state.csLogs || [];
} catch {}

function save() { localStorage.setItem(KEY, JSON.stringify(state)); chrome(); }
function go(name, params) {
  const q = params ? "?" + new URLSearchParams(params) : "";
  location.hash = name + q;
}
function route() {
  const raw = location.hash.replace(/^#/, "") || "home";
  const [name, qs] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  chrome();
  const views = {home, catalog, cart, checkout, login, practice, pharmacy, formulary, order, notifications, documents, refills, ops, mfrs, mfr, batch, inventory, environment, ingredients, qa, hub, "order-new": orderNew, patients: patientsView, "provider-register": providerRegister, "provider-profile": providerRegister};
  document.getElementById("app").innerHTML = (views[name] || home)(params);
}
function chrome() {
  const u = state.user;
  const count = (state.cart||[]).reduce((s,i)=>s+i.quantity,0);
  const roleBtn = document.getElementById("roleBtn");
  if (roleBtn) roleBtn.textContent = u ? staffLabel(u) : "Sign in";
  if (roleBtn) roleBtn.onclick = () => go(u ? homeFor() : "login");
  const unread = (state.notifications||[]).filter(n=>!n.read).length;
  const drafts = (state.drafts||[]).length;
  const links = [];
  if (u?.role === "rph") links.push(`<a href="#hub">Desk</a>`);
  if (canAccessOps(u)) links.push(`<a href="#ops">Lab</a><a href="#pharmacy">Intake</a><a href="#inventory">Inventory</a>`);
  if (canAccessProvider(u)) links.push(`<a href="#order-new">New order</a><a href="#patients">Patients</a><a href="#practice">Orders</a><a href="#practice">Drafts${drafts?` (${drafts})`:""}</a>${u.role==="doctor"?`<a href="#provider-profile">Profile</a>`:""}<a href="#notifications">Messages${unread?` (${unread})`:""}</a>`);
  if (canAccessQa(u)) links.push(`<a href="#qa">Quality</a>`);
  document.getElementById("nav").innerHTML = links.join("");
}

function addLine(productId, qty=1) {
  const p = product(productId);
  const doseId = state.selections[productId] || p.doses[0].id;
  const existing = state.cart.find(i => i.productId===productId && i.doseId===doseId);
  if (existing) existing.quantity += qty;
  else state.cart.push({productId, doseId, quantity: qty});
  save();
}
function cartTotal() {
  return state.cart.reduce((sum,item) => {
    const p = product(item.productId); const d = p && doseOf(p,item.doseId);
    return sum + (d ? d.price * item.quantity : 0);
  }, 0);
}
function selectDose(productId, doseId) {
  state.selections[productId] = doseId; save();
}

function notifyForStatus(order, status) {

    backorder: "Backorder on " + ticket,
    clarification: "Clarification needed on " + ticket,
    ready_pickup: "Ready for pickup · " + ticket,
    ready_delivery: "Out for delivery · " + ticket,
    order_update: "Order update · " + ticket
  };
  const bodies = {
    backorder: "Operations placed " + order.patientName + "'s order on backorder. No compounding details are shown here.",
    clarification: "Operations needs a clarification on " + order.patientName + "'s order. Upload a document from the exchange.",
    ready_pickup: order.patientName + "'s order is ready for pickup at the ISOSure pharmacy.",

  state.notifications.unshift({id:crypto.randomUUID(),kind,title:titles[kind],body:bodies[kind],orderId:order.id,createdAt:Date.now(),read:false});

let pendingDocKind = "rx";
let pendingRefillMsg = "";
function scriptListHtml() {
  if (!state.scripts.length) return `<li class="muted">No documents attached yet.</li>`;
  return state.scripts.map((s,i)=>`<li class="row"><span>${DOC_LABEL[s.kind]||s.kind} · ${s.name} <span class="muted">(${Math.round(s.size/1024)} KB)</span></span><button type="button" class="btn ghost" onclick="state.scripts.splice(${i},1);save();document.getElementById('scriptList').innerHTML=scriptListHtml()">Remove</button></li>`).join("");
}
function attachScripts(e) {
  const kind = document.getElementById("docKind")?.value || pendingDocKind || "rx";
  pendingDocKind = kind;
  [...e.target.files].forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      state.scripts.push({id:crypto.randomUUID(), name:file.name, type:file.type, size:file.size, dataUrl:reader.result, kind, uploadedAt:Date.now(), uploadedBy:"provider"});
      save();
      const list = document.getElementById("scriptList");
      if (list) list.innerHTML = scriptListHtml();
    };
    reader.readAsDataURL(file);
  });
}
function placeOrder(e) {
  e.preventDefault();
  const err = document.getElementById("err");
  if (!state.scripts.length) { err.textContent = "Attach at least one document (Rx image, PA, or formula) before submitting."; return false; }
  const f = e.target;
  const items = state.cart.map(item => {
    const p = product(item.productId); const d = doseOf(p,item.doseId);
    return {...item, productName:p.name, doseLabel:d.label, unitPrice:d.price};
  });
  const subtotal = items.reduce((s,i)=>s+i.unitPrice*i.quantity,0);
  const order = {
    id: crypto.randomUUID(), placedAt: Date.now(), status: "Submitted", items,
    total: subtotal + (subtotal>=75?0:8), notes: f.notes.value,
    patientName: f.patientName.value, patientDob: f.patientDob.value,
    practiceName: state.user.practiceName, prescriberName: state.user.prescriberName, npi: state.user.npi,
    address: `${f.line1.value}, ${f.city.value}, ${f.st.value} ${f.zip.value}`,
    scripts: state.scripts.slice()
  };
  const exchanged = state.scripts.map(doc => ({...doc, orderId: order.id}));
  state.documents = exchanged.concat(state.documents);
  state.orders.unshift(order);
  notifyForStatus({...order, status:"Received"}, "Received");
  state.crs = createCrsForOrder(order).concat(state.crs || []);
  seedLimsIfEmpty();
  state.cart = [];
  state.scripts = [];
  save();
  go("order",{id:order.id});
  return false;
}

function patientName(p) { return ((p.firstName||"") + " " + (p.lastName||"")).trim(); }
function searchPatientList(q) {
  const raw = (q||"").trim().toLowerCase();
  const digits = raw.replace(/\D/g,"");
  return (state.patients||[]).filter(p => {
    if (!raw) return true;
    const name = patientName(p).toLowerCase();
    const phone = (p.phone||"").replace(/\D/g,"");
    return name.includes(raw) || (p.id||"").toLowerCase().includes(raw) || (p.dob||"").includes(raw) || dobFmt(p.dob).toLowerCase().includes(raw) || (digits.length>=3 && phone.includes(digits));
  });
}
function families() {
  const map = {};
  (state.products||[]).forEach(p => {
    const name = familyOf(p);
    (map[name] = map[name] || []).push(p);
  });
  return Object.entries(map).map(([name, products]) => ({name, products, forms: [...new Set(products.map(p=>p.form))]}));
}
function parseMg(value) {
  const m = String(value||"").replace(/,/g,"").match(/([\d.]+)/);
  return m ? Number(m[1]) : null;
}
function wizardAlerts() {
  const w = state.wizard;
  const patient = (state.patients||[]).find(p => p.id===w.patientId);
  const prod = product(w.productId);
  const dose = prod && doseOf(prod, w.doseId);
  const alerts = [];
  if (!patient) alerts.push({id:"missing-patient",severity:"block",title:"Missing information",body:"Select or add a patient before submitting this order."});
  if (!prod || !dose) {
    alerts.push({id:"missing-medication",severity:"block",title:"Missing information",body:"Choose a medication and strength to continue."});
    return alerts;
  }
  if (!String(w.directions||"").trim()) alerts.push({id:"missing-directions",severity:"block",title:"Missing information",body:"Directions are required for this prescription."});
  if (!(Number(w.quantity)>0)) alerts.push({id:"missing-quantity",severity:"block",title:"Missing information",body:"Enter a quantity greater than zero."});
  if ((prod.requireWeight || isInjection(prod)) && patient && !String(patient.weightKg||"").trim()) {
    alerts.push({id:"missing-weight",severity:"block",title:"Missing information",body:"Patient weight is required for this medication."});
  }
  if (isInjection(prod)) {
    if (!String(w.doseAmount||"").trim()) alerts.push({id:"missing-dose-amount",severity:"block",title:"Missing information",body:"Enter the prescribed dose (mg) for this injection."});
    if (!String(w.volumeMl||"").trim()) alerts.push({id:"missing-volume",severity:"block",title:"Missing information",body:"Enter the volume (mL) to dispense for this injection."});
  }
  const start = prod.startingDoseMg;
  const prescribed = isInjection(prod) ? parseMg(w.doseAmount) : parseMg(dose.label);
  if (start != null && prescribed != null && prescribed > start) {
    alerts.push({id:"high-dose",severity:"warn",title:"Please review",body:"The prescribed dose exceeds the recommended starting dose for this product ("+start+" mg)."});
  }
  if (patient) {
    const active = {Submitted:1,Received:1,ClarificationNeeded:1,Backorder:1,InProduction:1,ReadyPickup:1,OutForDelivery:1};
    const dup = (state.orders||[]).find(o => active[o.status] && (o.patientId===patient.id || o.patientName===patientName(patient)) && (o.items||[]).some(i => i.productId===prod.id));
    if (dup) alerts.push({id:"duplicate-order",severity:"warn",title:"Potential duplicate",body:"This patient has an active order for the same medication ("+prod.shortName+")."});
    const allergies = String(patient.allergies||"").split(/[,;/]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
    const hit = allergies.find(a => (prod.name+" "+prod.shortName+" "+familyOf(prod)).toLowerCase().includes(a));
    if (hit) alerts.push({id:"allergy",severity:"warn",title:"Allergy alert",body:"Patient has a documented allergy to "+hit+"."});
  }
  return alerts;
}
function wizardContinue(next) {
  if (state.wizard.step === "patient") {
    const p = (state.patients||[]).find(x => x.id===state.wizard.patientId);
    const err = p ? patientProfileErrors(p) : {patient:"Select or add a patient."};

  };
  const preset = defaults[productId] || {directions: state.wizard.directions || "Take as directed", quantity: state.wizard.quantity || 30, unit: /capsule/i.test(p.form)?"capsules":/troche/i.test(p.form)?"troches":isInjection(p)?"mL":"grams"};

    doseId: d.id,

function submitWizard() {
  if (!canAccessProvider(state.user)) { go("login"); return; }

  const blocks = alerts.filter(a => a.severity==="block");
  const warns = alerts.filter(a => a.severity==="warn");
  if (blocks.length || warns.some(a => !(state.wizard.ack||[]).includes(a.id))) {
    state.wizard.step = "review";

  const p = state.patients.find(x => x.id===state.wizard.patientId);

    items: [{productId:prod.id,doseId:d.id,quantity:qty,productName:prod.name,doseLabel:d.label,unitPrice:d.price}],

        <label>Phone # <input placeholder="Phone" value="${patient.phone||""}" oninput="savePatientField('${patient.id}','phone',this.value)"></label>
        <label>Address <input placeholder="Address" value="${(patient.address&&patient.address.line1)||""}" oninput="savePatientField('${patient.id}','address.line1',this.value)"></label>
        <details class="extra"><summary>Email / clinical</summary><input placeholder="Email" value="${patient.email||""}" oninput="savePatientField('${patient.id}','email',this.value)"><input placeholder="Weight (kg)" value="${patient.weightKg||""}" oninput="savePatientField('${patient.id}','weightKg',this.value)"><textarea placeholder="Clinical notes" oninput="savePatientField('${patient.id}','clinicalNotes',this.value)">${patient.clinicalNotes||""}</textarea></details>
      </article>` : `
      <label>Search existing patient<input placeholder="Name, DOB, patient ID, or phone" value="${w.q||""}" oninput="state.wizard.q=this.value;save();route()"></label>
      ${searchPatientList(w.q).map(p => `<article class="panel pad" style="margin:.4rem 0;cursor:pointer" onclick="setWizard({patientId:'${p.id}'})"><strong>${patientName(p)}</strong><p class="muted">DOB ${dobFmt(p.dob)} · ${p.phone||"No phone"}</p></article>`).join("")}
      <button class="btn ghost" onclick="setWizard({adding:!state.wizard.adding})">+ Add new patient</button>
      ${w.adding ? htmlPatientForm() : ""}`;
  } else if (w.step==="medication") {
    body = `
      <h2>What would you like to order?</h2>
      <input placeholder="Search by medication, ingredient, dosage form…" value="${w.medq||""}" oninput="state.wizard.medq=this.value;save();route()">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:.8rem">
        ${fams.map(f => `<div class="tile" onclick="pickProduct('${f.products[0].id}')"><strong>${f.name}</strong><p class="muted">${f.forms.join(" · ")}</p></div>`).join("")}
      </div>
      ${selectedFam ? `<div class="panel pad" style="margin-top:.8rem">
        <p><strong>${selectedFam.name}</strong></p>
        <div class="forms">${selectedFam.products.map(p => `<button class="${prod&&prod.id===p.id?"on":""}" onclick="pickProduct('${p.id}')">${p.form}</button>`).join("")}</div>
        ${prod ? `<p style="margin-top:.8rem">Strength</p><div class="doses">${prod.doses.map(d => `<label><input type="radio" name="str" ${w.doseId===d.id?"checked":""} onchange="pickProduct('${prod.id}','${d.id}')"> ${d.label}</label>`).join("")}</div>` : ""}
      </div>` : ""}`;
  } else if (w.step==="prescription" && prod && dose) {
    body = `<div class="split">
      <article class="panel pad"><p class="kicker">Product</p><h2>What the pharmacy is making</h2><p><strong>${familyOf(prod)}</strong></p><p class="muted">${prod.form} · ${dose.label}</p><p class="muted">Operations maps this product to the current formula. Formula numbers, API lots, and process stay in the lab.</p></article>
      <article class="panel pad">
        <p class="kicker">Prescription</p><h2>What you are ordering for this patient</h2>
        <p>${prod.shortName} · ${dose.label}</p>
        ${isInjection(prod) ? `<div class="panel pad" style="background:var(--bg);margin:.6rem 0"><p><strong>Compounding details (provider view)</strong></p><p class="muted">Dose and volume only.</p>
          <label>Dose (mg)<input value="${w.doseAmount||""}" oninput="state.wizard.doseAmount=this.value;save()"></label>
          <label>Volume (mL)<input value="${w.volumeMl||""}" oninput="state.wizard.volumeMl=this.value;save()"></label></div>` : ""}
        <label>Directions<textarea oninput="state.wizard.directions=this.value;save()">${w.directions||""}</textarea></label>
        <label>Quantity (${w.unit||""})<input type="number" value="${w.quantity||""}" oninput="state.wizard.quantity=this.value;save()"></label>
        <label>Refills<input type="number" value="${w.refills||0}" oninput="state.wizard.refills=this.value;save()"></label>
        <label><input type="checkbox" ${w.daw?"checked":""} onchange="state.wizard.daw=this.checked;save()"> Dispense as written</label>
        <p class="muted">Prescriber · ${staffName(state.user)}</p>
        <label>Prescription notes<textarea oninput="state.wizard.notes=this.value;save()">${w.notes||""}</textarea></label>
      </article>
    </div>`;
  } else if (w.step==="review") {
    body = `
      ${patient && prod && dose ? `<article class="panel pad"><p><strong>${patientName(patient)}</strong> · DOB ${dobFmt(patient.dob)}</p><p>${prod.shortName} · ${dose.label}</p><p class="muted">${w.directions||""}</p></article>` : `<p class="muted">Finish the earlier steps first.</p>`}
      ${alerts.length ? alerts.map(a => `<div class="alert ${a.severity}"><strong>⚠️ ${a.title}</strong><p>${a.body}</p>${a.severity==="warn"?`<label><input type="checkbox" ${ (w.ack||[]).includes(a.id)?"checked":"" } onchange="state.wizard.ack=state.wizard.ack||[]; this.checked ? state.wizard.ack.push('${a.id}') : (state.wizard.ack=state.wizard.ack.filter(x=>x!=='${a.id}')); save(); route()"> I have reviewed this warning</label>`:`<p class="danger">Required correction — go back to fix this.</p>`}</div>`).join("") : `<p class="ok">No clinical alerts on this order.</p>`}`;
  }
  const idx = steps.indexOf(w.step);
  const canSubmit = !alerts.some(a => a.severity==="block") && alerts.filter(a => a.severity==="warn").every(a => (w.ack||[]).includes(a.id));
  return `
    <p class="kicker">New medication order</p>
    <h1>Start with the patient, then the medication</h1>
    <p class="muted">You prescribe the product. Operations maps it to the formula.</p>
    <div class="dash-links" style="margin:1rem 0">${nav}</div>
    ${body}
    <p style="margin-top:1rem">
      ${idx>0?`<button class="btn ghost" onclick="setWizard({step:'${steps[idx-1]}'})">Back</button>`:""}
      ${w.step!=="review"?`<button class="btn" onclick="wizardContinue('${steps[Math.min(steps.length-1,idx+1)]}')">Continue</button>`:`<button class="btn" ${canSubmit?"":"disabled"} onclick="submitWizard()">Submit to Operations</button>`}
      <button class="btn ghost" onclick="exitDraft()">Save draft & exit</button>
    </p>`;
}

function pharmacy() {
  if (!canAccessOps(state.user)) return `<h1>Operations sign-in required</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  seedLimsIfEmpty();
  return `
    <div class="row">
      <div>
        <p class="kicker">Operations</p>
        <h1>Incoming provider orders</h1>
        <p class="muted">${state.user.contactName} · ${state.user.pharmacyName}. Status changes notify the provider portal. Compounding stays in Operations.</p>
      </div>
      <div>
        <button class="btn ghost" onclick="go('ops')">Lab pipeline</button>
        <button class="btn ghost" onclick="go('refills')">Refill inbox</button>
        <button class="btn ghost" onclick="go('formulary')">Edit formulary</button>
        <button class="btn ghost" onclick="state.user=null;save();go('login')">Sign out</button>
      </div>
    </div>
    ${orderCards(state.orders, true)}`;
}

function orderCards(orders, admin=false) {
  if (!orders.length) return `<p class="muted">No orders yet.</p>`;
  return orders.map(o => `
    <article class="panel pad" style="margin:.7rem 0">
      <div class="row">
        <div>
          <span class="chip">${STATUS_LABEL[o.status] || o.status}</span>
          <h2 style="margin:.35rem 0 0">ISO-${o.id.slice(-6).toUpperCase()}</h2>
          <p class="muted">${new Date(o.placedAt).toLocaleDateString()} · ${o.practiceName} · Patient ${o.patientName}</p>
        </div>
        <strong>${money(o.total)}</strong>
      </div>
      ${o.items.map((i, idx) => {
        const cr = (state.crs||[]).find(c => c.orderId===o.id && (c.itemIndex===idx || c.productName===i.productName));
        const ordered = cr?.orderedQty ?? i.quantity;
        const note = cr && cr.compoundQty!=null
          ? ` → compound ${cr.compoundQty}${cr.qtyManuallyAdjusted?" (adjusted)": cr.compoundQty!==ordered?" (auto-round)":""}`
          : "";
        return `<p>${i.productName} · ${i.doseLabel} · ordered ${ordered}${note}</p>`;
      }).join("")}
      ${o.scripts?.length ? `<p class="muted">${o.scripts.length} document${o.scripts.length>1?"s":""} on the ticket</p>` : `<p class="muted">Documents live in the exchange for this demo order</p>`}
      ${admin ? `<ul>${(state.crs||[]).filter(c=>c.orderId===o.id).map(c=>`<li><a href="#batch?id=${c.id}">${c.batchLot} · ${STAGE_LABEL[c.stage]||c.stage}${c.hd?" · HD":""}</a></li>`).join("")}</ul>` : ""}
      ${admin ? `<label>Operations status (notifies provider)
        <select onchange="setOrderStatus('${o.id}', this.value)">
          ${STATUS_LIST.map(s=>`<option value="${s}" ${s===o.status?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}
        </select>
      </label>` : `<p><a href="#refills?order=${o.id}">Request refill</a></p>`}
      <p><a href="#order?id=${o.id}">Open ticket</a></p>
    </article>`).join("");
}

function order(params) {
  const o = state.orders.find(x => x.id===params.id);
  if (!o) return `<h1>Order not found</h1>`;
  const related = [
    ...(o.scripts||[]),
    ...(state.documents||[]).filter(d => d.orderId===o.id && !(o.scripts||[]).some(s => s.id===d.id))
  ];
  const isProvider = canAccessProvider(state.user);
  return `
    <p class="kicker">${STATUS_LABEL[o.status] || o.status}</p>
    <h1>Order ISO-${o.id.slice(-6).toUpperCase()}</h1>
    <p class="muted">${o.prescriberName} · ${o.practiceName} · Patient ${o.patientName}</p>
    <p class="muted">Status comes from Operations. This ticket does not include compounding instructions.</p>
    ${o.prescription ? `<div class="split" style="margin:.8rem 0">
      <article class="panel pad"><p class="kicker">Product</p><h2>What the pharmacy is making</h2><p>${o.items[0]?.productName} · ${o.items[0]?.doseLabel}</p><p class="muted">Formula, lots, and process stay in Operations.</p></article>
      <article class="panel pad"><p class="kicker">Prescription</p><h2>What was ordered for this patient</h2><p>${o.prescription.directions||""}</p><p class="muted">Qty ${o.prescription.quantity} ${o.prescription.quantityUnit||""} · ${o.prescription.refills||0} refills${o.prescription.daw?" · DAW":""}${o.prescription.doseAmount?` · Dose ${o.prescription.doseAmount} mg`:""}${o.prescription.volumeMl?` · Volume ${o.prescription.volumeMl} mL`:""}</p></article>
    </div>` : ""}
    <div class="panel pad">
      ${o.items.map(i=>`<p class="row"><span>${i.productName}<br><span class="muted">${i.doseLabel} × ${i.quantity}</span></span><span>${money(i.unitPrice*i.quantity)}</span></p>`).join("")}
      <p class="row"><strong>Total</strong><strong>${money(o.total)}</strong></p>
      <p class="muted">${o.address||""}</p>
      ${o.notes?`<p>Note to Operations: ${o.notes}</p>`:""}
      <h2>Documents</h2>
      ${related.length ? related.map(s=>`<p>${DOC_LABEL[s.kind]||s.kind} · ${s.dataUrl?`<a href="${s.dataUrl}" download="${s.name}">${s.name}</a>`:s.name}</p>`).join("") : `<p class="muted">No files on this ticket.</p>`}
    </div>
    <p style="margin-top:1rem">
      <button class="btn" onclick="go(state.user?.role==='pharmacy'?'pharmacy':'practice')">Back</button>
      ${isProvider ? `<button class="btn ghost" onclick="go('refills',{order:'${o.id}'})">Request refill</button>` : ""}
    </p>`;
}

function notifications() {
  if (!canAccessProvider(state.user)) return `<h1>Provider login required</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  const notes = state.notifications || [];
  return `
    <p class="kicker">Provider portal</p>
    <h1>Notifications from Operations</h1>
    <p class="muted">Backorder, clarification needed, ready-for-pickup, and delivery alerts. The portal only displays what Operations sends.</p>
    ${notes.length ? notes.map(n => `
      <article class="panel pad" style="margin:.7rem 0;${n.read?"":"border-color:var(--purple-mid);background:#f8f6ef"}">
        <div class="row">
          <div>
            <p class="kicker">${NOTE_LABEL[n.kind]||n.kind}</p>
            <h2 style="margin:.25rem 0 0">${n.title}</h2>
            <p class="muted">${n.body}</p>
            <p class="muted">${new Date(n.createdAt).toLocaleString()}</p>
          </div>
          ${n.read?"":`<button class="btn ghost" onclick="state.notifications.find(x=>x.id==='${n.id}').read=true;save();route()">Mark read</button>`}
        </div>
        ${n.orderId?`<p><a href="#order?id=${n.orderId}">Open related order</a></p>`:""}
      </article>`).join("") : `<p class="muted">No notifications yet.</p>`}`;
}

function documents() {
  if (!canAccessProvider(state.user)) return `<h1>Provider login required</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  const docs = state.documents || [];
  return `
    <p class="kicker">Provider portal</p>
    <h1>Document exchange</h1>
    <p class="muted">Send Rx images, PA forms, and patient-specific formulas to Operations. Files are stored as documents only — this portal does not interpret or compound them.</p>
    <div class="panel pad grid" style="margin:1rem 0">
      <label>Document type
        <select id="exchangeKind">
          <option value="rx">Rx image</option>
          <option value="pa">PA form</option>
          <option value="formula">Patient-specific formula</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Related order (optional)
        <select id="exchangeOrder">
          <option value="">None</option>
          ${state.orders.map(o=>`<option value="${o.id}">${o.patientName} · ${o.id.slice(-6).toUpperCase()}</option>`).join("")}
        </select>
      </label>
      <input type="file" accept=".pdf,image/*" multiple onchange="attachExchange(event)">
    </div>
    <div class="panel" style="overflow:auto">
      <table>
        <thead><tr><th>Document</th><th>Type</th><th>Order</th><th>Uploaded</th></tr></thead>
        <tbody>
          ${docs.map(d=>`<tr>
            <td>${d.dataUrl?`<a href="${d.dataUrl}" download="${d.name}">${d.name}</a>`:d.name}</td>
            <td>${DOC_LABEL[d.kind]||d.kind}</td>
            <td>${d.orderId?d.orderId.slice(-6).toUpperCase():"—"}</td>
            <td>${new Date(d.uploadedAt||Date.now()).toLocaleDateString()}</td>
          </tr>`).join("") || `<tr><td colspan="4" class="muted">No documents exchanged yet.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function attachExchange(e) {
  const kind = document.getElementById("exchangeKind")?.value || "rx";
  const orderId = document.getElementById("exchangeOrder")?.value || "";
  [...e.target.files].forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      state.documents.unshift({id:crypto.randomUUID(),name:file.name,type:file.type,size:file.size,dataUrl:reader.result,kind,orderId:orderId||undefined,uploadedAt:Date.now(),uploadedBy:"provider"});
      save(); route();
    };
    reader.readAsDataURL(file);
  });
}

function refills(params) {
  if (!state.user) return `<h1>Sign in required</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  if (canAccessOps(state.user) && !canAccessProvider(state.user)) return refillInbox();
  const selected = params.order || state.orders[0]?.id || "";
  return `
    <p class="kicker">Provider portal</p>
    <h1>Refill requests</h1>
    <p class="muted">Ask Operations to refill a prior order. The portal forwards the request; the lab decides whether the previous compound can be repeated.</p>
    <form class="panel pad grid" style="margin:1rem 0" onsubmit="return submitRefill(event)">
      <label>Prior order
        <select name="orderId" required>
          <option value="">Select an order</option>
          ${state.orders.map(o=>`<option value="${o.id}" ${o.id===selected?"selected":""}>${o.patientName} · ${o.items.map(i=>i.doseLabel).join(", ")}</option>`).join("")}
        </select>
      </label>
      <label>Note to Operations
        <textarea name="notes" rows="3" placeholder="Continue current strength, or flag a change for the lab to review."></textarea>
      </label>
      <button class="btn" type="submit">Submit refill request</button>
      <p id="refillMsg" class="ok">${pendingRefillMsg}</p>
    </form>
    ${(state.refills||[]).map(r=>`
      <article class="panel pad" style="margin:.6rem 0">
        <p class="kicker">${r.status}</p>
        <strong>${r.patientName}</strong>
        <p class="muted">${r.summary}</p>
        ${r.notes?`<p>${r.notes}</p>`:""}
        <p class="muted">${new Date(r.requestedAt).toLocaleString()}</p>
      </article>`).join("") || `<p class="muted">No refill requests yet.</p>`}`;
}
function submitRefill(e) {
  e.preventDefault();
  const f = e.target;
  const order = state.orders.find(x => x.id === f.orderId.value);
  if (!order) { document.getElementById("refillMsg").textContent = "Choose a prior order."; return false; }
  state.refills.unshift({
    id: crypto.randomUUID(),
    orderId: order.id,
    patientName: order.patientName,
    summary: order.items.map(i => i.productName + " " + i.doseLabel).join(" · "),
    notes: f.notes.value,
    requestedAt: Date.now(),
    status: "Submitted"
  });
  save();
  pendingRefillMsg = "Refill submitted to Operations.";
  route();
  return false;
}
function refillInbox() {
  return `
    <p class="kicker">Operations</p>
    <h1>Refill requests</h1>
    <p class="muted">Providers submitted these as thin-client requests. Accepting a refill does not expose compounding steps back to the portal.</p>
    ${(state.refills||[]).length ? state.refills.map(r=>`
      <article class="panel pad" style="margin:.7rem 0">
        <strong>${r.patientName}</strong>
        <p class="muted">${r.summary}</p>
        ${r.notes?`<p>${r.notes}</p>`:""}
        <p class="muted">${new Date(r.requestedAt).toLocaleString()}</p>
        <label>Decision
          <select onchange="setRefillStatus('${r.id}', this.value)">
            ${["Submitted","Accepted","Declined"].map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}
          </select>
        </label>
      </article>`).join("") : `<p class="muted">No refill requests.</p>`}`;
}
function setRefillStatus(id, status) {
  const refill = state.refills.find(x => x.id === id);
  if (!refill) return;
  refill.status = status;
  state.notifications.unshift({
    id: crypto.randomUUID(),
    kind: "refill",
    title: "Refill " + status.toLowerCase(),
    body: "Operations " + status.toLowerCase() + " the refill for " + refill.patientName + " (" + refill.summary + ").",
    orderId: refill.orderId,
    createdAt: Date.now(),
    read: false
  });
  save(); route();
}

function formulary() {
  if (state.user?.role !== "pharmacy") return `<h1>Pharmacy admin only</h1><button class="btn" onclick="go('login')">Sign in as pharmacy</button>`;
  return `
    <p class="kicker">Pharmacy admin</p>
    <h1>Medication list</h1>
    <p class="muted">Upload a CSV or JSON list, or add and edit compounds by hand. This is the list doctors order from. CSV columns: <code>name,shortName,category,form,doses,summary</code>. Doses use <code>label:price|label:price</code>.</p>
    <div class="panel pad grid" style="margin:1rem 0">
      <strong>Upload a custom list</strong>
      <input type="file" accept=".csv,.json,text/csv,application/json" onchange="importList(event)">
      <p class="muted">Upload replaces the current formulary. Keep a copy of your file.</p>
    </div>
    <form class="panel pad grid" onsubmit="return addMed(event)">
      <strong>Manually add a compound</strong>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <input name="name" required placeholder="Medication name">
        <input name="shortName" placeholder="Short name">
        <select name="category">${CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select>
        <input name="form" required placeholder="Form (Cream, Capsule…)">
      </div>
      <input name="doses" required placeholder="Doses, e.g. 50 mg:42|100 mg:52">
      <input name="summary" placeholder="Short description">
      <button class="btn" type="submit">Add to formulary</button>
    </form>
    <div class="panel" style="overflow:auto;margin-top:1rem">
      <table>
        <thead><tr><th>Medication</th><th>Doses</th><th></th></tr></thead>
        <tbody>
          ${state.products.map((p,idx)=>`<tr>
            <td><strong>${p.name}</strong><div class="muted">${p.form} · ${p.category}</div></td>
            <td>${p.doses.map(d=>`${d.label} ${money(d.price)}`).join(" · ")}</td>
            <td class="row">
              <button class="btn ghost" onclick="editMed(${idx})">Edit</button>
              <button class="btn danger" onclick="if(confirm('Remove ${p.name}?')){state.products.splice(${idx},1);save();route()}">Remove</button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function parseDoses(raw) {
  return raw.split("|").map((part,i) => {
    const [label, price] = part.split(":").map(s => s.trim());
    return {id:"d"+i+"-"+label.toLowerCase().replace(/[^a-z0-9]+/g,"-"), label: label||("Dose "+(i+1)), price: Number(price)||0};
  });
}
function addMed(e) {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  state.products.push({
    id: name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),
    name, shortName: f.shortName.value || name, category: f.category.value, form: f.form.value,
    summary: f.summary.value, doses: parseDoses(f.doses.value)
  });
  save(); route(); return false;
}
function editMed(idx) {
  const p = state.products[idx];
  const name = prompt("Medication name", p.name); if (name==null) return;
  const doses = prompt("Doses as label:price|label:price", p.doses.map(d=>d.label+":"+d.price).join("|")); if (doses==null) return;
  const summary = prompt("Summary", p.summary); if (summary==null) return;
  p.name = name; p.summary = summary; p.doses = parseDoses(doses);
  save(); route();
}
function importList(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result);
      if (file.name.endsWith(".json")) {
        const data = JSON.parse(text);
        const rows = Array.isArray(data) ? data : data.products;
        state.products = rows.map(normalizeImported);
      } else {
        state.products = parseCsv(text);
      }
      save(); route();
    } catch (err) {
      alert("Could not import that file: " + err.message);
    }
  };
  reader.readAsText(file);
}
function normalizeImported(row) {
  return {
    id: (row.id || row.name || crypto.randomUUID()).toString().toLowerCase().replace(/[^a-z0-9]+/g,"-"),
    name: row.name, shortName: row.shortName || row.name, category: normalizeCategory(row.category, row.id),
    form: row.form || "Capsule", summary: row.summary || "",
    doses: Array.isArray(row.doses) ? row.doses.map((d,i)=>({id:d.id||("d"+i), label:d.label, price:Number(d.price)||0})) : parseDoses(String(row.doses||"Standard:0"))
  };

function parseCsv(text) {

function advanceBatch(crId) {
  const cr = state.crs.find(c=>c.id===crId); if (!cr) return;
  const rec = state.mfrs.find(m=>m.id===cr.mfrId);
  const next = {intake:"formula",formula:"compounding",compounding:"labeling",labeling:"dispense",dispense:"shipped"}[cr.stage];
  if (!next) return;
  if ((next==="formula" || next==="compounding") && !rec) { alert("Assign an MFR first."); return; }
  if (next==="compounding") {
    const missing = [];
    cr.ingredientsUsed = rec.lines.map(line => {
      const lot = pickLot(line.id);
      if (!lot) { missing.push(ingName(line.id)); return {ingredientId:line.id,lotId:"",formulaQty:line.qty,weighedQty:line.qty,unit:line.unit,potencyPct:100}; }
      const weighed = Math.round(line.qty * (100/(lot.potencyPct||100)) * 1000)/1000;
      return {ingredientId:line.id,lotId:lot.id,formulaQty:line.qty,weighedQty:weighed,unit:line.unit,potencyPct:lot.potencyPct};
    });
    if (missing.length) { alert("Missing usable lot for: " + missing.join(", ")); return; }
    const bud = calculateBud(rec, cr.ingredientsUsed.map(r => (state.lots.find(l=>l.id===r.lotId)||{}).expiresAt));
    cr.budHours = bud.hours; cr.budDate = bud.date; cr.budBasis = bud.basis; cr.budStorage = bud.storage; cr.cappedBy = bud.cappedBy;
  }
  if (next==="labeling") {
    cr.ingredientsUsed.forEach(r => {
      const lot = state.lots.find(l=>l.id===r.lotId); if (!lot) return;
      lot.remaining = Math.max(0, Math.round((lot.remaining - r.weighedQty)*1000)/1000);
      const ing = state.ingredients.find(i=>i.id===r.ingredientId);
      if (ing && ing.cs) state.csLogs.unshift({id:crypto.randomUUID(), at:Date.now(), ingredientId:ing.id, lotId:lot.id, crId:cr.id, quantity:r.weighedQty, unit:r.unit, remaining:lot.remaining, pharmacist:state.user.contactName});
    });
  }
  if (next==="dispense") {
    cr.labelText = (rec.hd?"HAZARDOUS DRUG — USP <800>\\n":"") + cr.productName + " " + cr.doseLabel + "\\nPatient: " + cr.patientName + "\\nBatch " + cr.batchLot + "\\nBUD " + (cr.budDate?new Date(cr.budDate).toLocaleDateString():"—") + " · store " + cr.budStorage + "\\nUSP <" + rec.chapter + ">";
  }
  cr.stage = next;
  const related = state.crs.filter(c=>c.orderId===cr.orderId);
  const rank = STAGES;
  const lowest = related.reduce((min,c)=> rank.indexOf(c.stage) < rank.indexOf(min) ? c.stage : min, related[0].stage);
  const map = {intake:"Received",formula:"InProduction",compounding:"InProduction",labeling:"InProduction",dispense:"ReadyPickup",shipped:"OutForDelivery"};
  const status = map[lowest];
  const order = state.orders.find(o=>o.id===cr.orderId);
  if (order && status && order.status !== status) { order.status = status; notifyForStatus(order, status); }
  save(); route();
}

    <p class="muted">Table 1 antineoplastics, Table 2 non-antineoplastic HDs, Table 3 reproductive risk.</p>
    <div class="panel" style="overflow:auto"><table>
      <thead><tr><th>Ingredient</th><th>CAS</th><th>NIOSH</th><th>HD</th><th>CS</th><th>Reorder</th></tr></thead>
      <tbody>${state.ingredients.map(i=>`<tr><td>${i.name}</td><td>${i.cas||"—"}</td><td class="${i.niosh?"danger":""}">${i.niosh?("Table "+i.niosh):"—"}</td><td>${i.hd?"Yes":"No"}</td><td>${i.cs?("C-"+i.cs):"—"}</td><td>${i.reorderPoint??"—"} ${i.unit||""}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>

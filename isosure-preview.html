<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISOSure | Practice ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple-deep: #3D1E68;
      --purple: #4B2475;
      --purple-mid: #9267B9;
      --purple-soft: #EDE6F5;
      --ink: #1F1630;
      --muted: #6B6280;
      --line: #E4DDEF;
      --paper: #FFFFFF;
      --bg: #F7F4FB;
      --danger: #9B1C3A;
      --ok: #2F6D4F;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body { font-family: Inter, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    header {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: .65rem 1.25rem; background: #fff; border-bottom: 1px solid var(--line);
    }
    .logo { height: 56px; width: auto; display: block; cursor: pointer; }
    nav { display: flex; gap: 1.1rem; color: var(--muted); font-size: .92rem; font-weight: 500; }
    nav a:hover { color: var(--purple); }
    .actions { display: flex; gap: .5rem; align-items: center; }
    .btn {
      border: 0; border-radius: 8px; padding: .55rem 1rem; cursor: pointer;
      background: var(--purple-deep); color: #fff; font-weight: 600;
    }
    .btn.ghost { background: #fff; color: var(--purple); border: 1px solid var(--line); }
    .btn.mid { background: var(--purple-mid); }
    .btn.danger { background: var(--danger); }
    .badge {
      background: var(--purple-mid); color: #fff; border-radius: 999px; min-width: 1.2rem;
      padding: 0 .35rem; font-size: 11px; display: inline-grid; place-items: center;
    }
    main { flex: 1; width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 1.6rem 0 3rem; }
    footer { background: var(--purple-deep); color: #fff; padding: 2rem 1.25rem; }
    .footer-inner { width: min(1120px, 100%); margin: 0 auto; display: grid; gap: 1rem; }
    @media (min-width: 800px) { .footer-inner { grid-template-columns: 220px 1fr 1fr; align-items: center; } }
    @media (max-width: 799px) { nav { display: none; } .logo { height: 44px; } }
    .kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--purple-mid); font-weight: 600; }
    h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: .25rem 0 .6rem; }
    h2 { font-size: 1.2rem; }
    .muted { color: var(--muted); }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .pad { padding: 1rem 1.1rem; }
    .row { display: flex; justify-content: space-between; gap: .8rem; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; gap: .75rem; }
    .hero {
      display: grid; gap: 1.25rem; background: var(--purple-deep); color: #fff;
      border-radius: 16px; padding: 1.4rem; overflow: hidden;
    }
    @media (min-width: 860px) { .hero { grid-template-columns: 1.2fr .8fr; align-items: center; } }
    .hero .muted { color: #d9ccec; }
    .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem; cursor: pointer; }
    .tile:hover { border-color: var(--purple-mid); }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: .6rem .7rem;
    }
    label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: .65rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .85rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: #fbf9fe; }
    .doses { display: flex; flex-wrap: wrap; gap: .45rem .8rem; }
    .doses label { margin: 0; font-weight: 400; display: flex; gap: .35rem; align-items: center; cursor: pointer; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
    .qty button { width: 32px; height: 32px; border: 0; background: none; cursor: pointer; }
    .chip { display: inline-block; background: var(--purple-soft); color: var(--purple); border-radius: 999px; padding: .15rem .55rem; font-size: 12px; font-weight: 600; }
    .danger { color: var(--danger); }
    .ok { color: var(--ok); }
    .split { display: grid; gap: 1rem; }
    @media (min-width: 860px) { .split { grid-template-columns: 220px 1fr; } .split.checkout { grid-template-columns: 1.15fr .85fr; } }
    .drop { border: 1px dashed var(--purple-mid); border-radius: 10px; padding: 1rem; background: #fcfaff; }
    .tagline { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #c9b6e3; }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="brand/isosure-logo.png" alt="ISOSure Consulting" onclick="go('home')" />
    <nav id="nav"></nav>
    <div class="actions">
      <button class="btn ghost" id="roleBtn" onclick="go('login')">Sign in</button>
      <button class="btn" onclick="go('cart')">Order <span class="badge" id="cartBadge" hidden>0</span></button>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <div class="footer-inner">
      <img src="brand/isosure-logo-inverse.png" alt="ISOSure" style="height:92px;width:auto" />
      <div>
        <p>ISOSure Consulting</p>
        <p class="tagline">Consulting · Compliance · Compounding · Software</p>
        <p>pharmacy@isosure.example · (800) 555-4767</p>
      </div>
      <div>
        <p>Doctors and offices place compounding orders. The pharmacy lab reviews scripts and produces the fill. Phase 2 will move these orders onto the production website.</p>
      </div>
    </div>
  </footer>

<script>
const KEY = "isosure.practice.v2";
const CATEGORIES = ["Hormone Therapy","Women's Health","Men's Health","Thyroid","Pain & Inflammation","Dermatology","Wellness","Pediatric"];
const DEFAULT_PRODUCTS = [
  {id:"estradiol-cream",name:"IsoBalance Estradiol Cream",shortName:"Estradiol Cream",category:"Hormone Therapy",form:"Cream",summary:"Bioidentical estradiol cream for transdermal hormone support.",doses:[{id:"e2-025",label:"0.25 mg/g",price:48},{id:"e2-05",label:"0.5 mg/g",price:56},{id:"e2-1",label:"1 mg/g",price:64}]},
  {id:"progesterone-caps",name:"IsoCalm Progesterone Capsules",shortName:"Progesterone Capsules",category:"Women's Health",form:"Capsule",summary:"Micronized progesterone for evening hormone balance.",doses:[{id:"p4-50",label:"50 mg",price:42},{id:"p4-100",label:"100 mg",price:52},{id:"p4-200",label:"200 mg",price:68}]},
  {id:"testosterone-gel",name:"IsoVigor Testosterone Gel",shortName:"Testosterone Gel",category:"Men's Health",form:"Gel",summary:"Quick-dry testosterone gel in measured daily strengths.",doses:[{id:"t-10",label:"10 mg/mL",price:62},{id:"t-20",label:"20 mg/mL",price:74},{id:"t-50",label:"50 mg/mL",price:88}]},
  {id:"thyroid-combo",name:"IsoThyroid T3/T4 Capsules",shortName:"T3/T4 Capsules",category:"Thyroid",form:"Capsule",summary:"Custom liothyronine and levothyroxine ratios.",doses:[{id:"th-5-25",label:"5 / 25 mcg",price:38},{id:"th-10-50",label:"10 / 50 mcg",price:44},{id:"th-15-75",label:"15 / 75 mcg",price:52}]},
  {id:"ketoprofen-cream",name:"IsoEase Ketoprofen Cream",shortName:"Ketoprofen Cream",category:"Pain & Inflammation",form:"Cream",summary:"High-strength topical NSAID for joint and muscle pain.",doses:[{id:"keto-10",label:"10%",price:46},{id:"keto-15",label:"15%",price:54},{id:"keto-20",label:"20%",price:62}]},
  {id:"gabapentin-topical",name:"IsoNerve Gabapentin Topical",shortName:"Gabapentin Topical",category:"Pain & Inflammation",form:"Topical",summary:"Targeted gabapentin gel for neuropathic pain.",doses:[{id:"gaba-6",label:"6%",price:58},{id:"gaba-10",label:"10%",price:68}]},
  {id:"diclofenac-gel",name:"IsoFlex Diclofenac Gel",shortName:"Diclofenac Gel",category:"Pain & Inflammation",form:"Gel",summary:"Compounded diclofenac in strengths above typical retail.",doses:[{id:"diclo-3",label:"3%",price:36},{id:"diclo-5",label:"5%",price:44},{id:"diclo-10",label:"10%",price:55}]},
  {id:"ldn-caps",name:"IsoReset Low-Dose Naltrexone",shortName:"Low-Dose Naltrexone",category:"Wellness",form:"Capsule",summary:"Precise LDN capsules, dye- and filler-conscious.",doses:[{id:"ldn-15",label:"1.5 mg",price:34},{id:"ldn-3",label:"3 mg",price:36},{id:"ldn-45",label:"4.5 mg",price:38}]},
  {id:"hydroquinone",name:"IsoGlow Hydroquinone Cream",shortName:"Hydroquinone Cream",category:"Dermatology",form:"Cream",summary:"Prescription hydroquinone for stubborn discoloration.",doses:[{id:"hq-4",label:"4%",price:41},{id:"hq-6",label:"6%",price:49},{id:"hq-8",label:"8%",price:58}]},
  {id:"tretinoin",name:"IsoClear Tretinoin Cream",shortName:"Tretinoin Cream",category:"Dermatology",form:"Cream",summary:"Tretinoin in a soothing cream base.",doses:[{id:"tret-025",label:"0.025%",price:39},{id:"tret-05",label:"0.05%",price:45},{id:"tret-1",label:"0.1%",price:52}]},
  {id:"minoxidil",name:"IsoFollicle Minoxidil Compound",shortName:"Minoxidil Compound",category:"Dermatology",form:"Topical",summary:"Higher-strength minoxidil scalp solution.",doses:[{id:"mino-5",label:"5%",price:44},{id:"mino-7",label:"7%",price:54},{id:"mino-10",label:"10%",price:66}]},
  {id:"omeprazole-susp",name:"IsoSoothe Pediatric Omeprazole",shortName:"Pediatric Omeprazole",category:"Pediatric",form:"Suspension",summary:"Flavored omeprazole suspension for children.",doses:[{id:"ome-2",label:"2 mg/mL",price:48},{id:"ome-5",label:"5 mg/mL",price:56}]},
  {id:"melatonin-troche",name:"IsoRest Melatonin Troches",shortName:"Melatonin Troches",category:"Wellness",form:"Troche",summary:"Slow-dissolve melatonin in titratable strengths.",doses:[{id:"mel-1",label:"1 mg",price:22},{id:"mel-3",label:"3 mg",price:24},{id:"mel-5",label:"5 mg",price:26}]},
  {id:"dhea-caps",name:"IsoPrime DHEA Capsules",shortName:"DHEA Capsules",category:"Hormone Therapy",form:"Capsule",summary:"Micronized DHEA for clinician-guided protocols.",doses:[{id:"dhea-5",label:"5 mg",price:28},{id:"dhea-10",label:"10 mg",price:32},{id:"dhea-25",label:"25 mg",price:38}]},
  {id:"pregnenolone",name:"IsoBloom Pregnenolone Capsules",shortName:"Pregnenolone Capsules",category:"Hormone Therapy",form:"Capsule",summary:"Pregnenolone precursor support in conservative strengths.",doses:[{id:"preg-10",label:"10 mg",price:29},{id:"preg-25",label:"25 mg",price:34},{id:"preg-50",label:"50 mg",price:40}]},
  {id:"sildenafil-troche",name:"IsoLift Sildenafil Troches",shortName:"Sildenafil Troches",category:"Men's Health",form:"Troche",summary:"Fast-dissolve sildenafil troches.",doses:[{id:"sild-25",label:"25 mg",price:48},{id:"sild-50",label:"50 mg",price:62},{id:"sild-100",label:"100 mg",price:78}]},
  {id:"glutathione",name:"IsoShield Glutathione Capsules",shortName:"Glutathione Capsules",category:"Wellness",form:"Capsule",summary:"Reduced glutathione in acid-resistant capsules.",doses:[{id:"glu-250",label:"250 mg",price:36},{id:"glu-500",label:"500 mg",price:48}]},
  {id:"nad-spray",name:"IsoPulse NAD+ Nasal Spray",shortName:"NAD+ Nasal Spray",category:"Wellness",form:"Nasal spray",summary:"Metered NAD+ nasal spray.",doses:[{id:"nad-50",label:"50 mg/mL",price:84},{id:"nad-100",label:"100 mg/mL",price:112}]}
];

const money = (n) => (Number(n)||0).toLocaleString("en-US",{style:"currency",currency:"USD"});
const product = (id) => state.products.find(p => p.id === id);
const doseOf = (p, id) => p.doses.find(d => d.id === id);

let state = { user:null, cart:[], orders:[], products: DEFAULT_PRODUCTS, scripts:[], selections:{} };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  state = Object.assign(state, saved, { selections: saved.selections || {} });
  if (!state.products?.length) state.products = DEFAULT_PRODUCTS;
} catch {}

function save() { localStorage.setItem(KEY, JSON.stringify(state)); chrome(); }
function go(name, params) {
  const q = params ? "?" + new URLSearchParams(params) : "";
  location.hash = name + q;
}
function route() {
  const raw = location.hash.replace(/^#/, "") || "home";
  const [name, qs] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  chrome();
  const views = {home, catalog, cart, checkout, login, practice, pharmacy, formulary, order};
  document.getElementById("app").innerHTML = (views[name] || home)(params);
}
function chrome() {
  const count = state.cart.reduce((s,i)=>s+i.quantity,0);
  const badge = document.getElementById("cartBadge");
  badge.hidden = !count; badge.textContent = count;
  const u = state.user;
  document.getElementById("roleBtn").textContent = u ? (u.role==="pharmacy" ? u.pharmacyName : u.practiceName) : "Sign in";
  document.getElementById("nav").innerHTML = u?.role === "pharmacy"
    ? `<a href="#formulary">Formulary</a><a href="#pharmacy">Production queue</a>`
    : `<a href="#catalog">Formulary</a><a href="#practice">Practice orders</a>`;
}

function addLine(productId, qty=1) {
  const p = product(productId);
  const doseId = state.selections[productId] || p.doses[0].id;
  const existing = state.cart.find(i => i.productId===productId && i.doseId===doseId);
  if (existing) existing.quantity += qty;
  else state.cart.push({productId, doseId, quantity: qty});
  save();
}
function cartTotal() {
  return state.cart.reduce((sum,item) => {
    const p = product(item.productId); const d = p && doseOf(p,item.doseId);
    return sum + (d ? d.price * item.quantity : 0);
  }, 0);
}
function selectDose(productId, doseId) {
  state.selections[productId] = doseId; save();
}

function demoOrders() {
  return [
    {id:"demo-1",placedAt:Date.now()-12*864e5,status:"Compounding",total:120,patientName:"Avery Nguyen",practiceName:"Hawthorne Family Medicine",prescriberName:"Dr. Maya Ellison, MD",npi:"1234567890",notes:"Match last fill.",address:"418 Hawthorne Blvd, Portland, OR 97214",scripts:[],items:[
      {productId:"estradiol-cream",doseId:"e2-05",quantity:1,productName:"IsoBalance Estradiol Cream",doseLabel:"0.5 mg/g",unitPrice:56},
      {productId:"progesterone-caps",doseId:"p4-100",quantity:1,productName:"IsoCalm Progesterone Capsules",doseLabel:"100 mg",unitPrice:52}
    ]},
    {id:"demo-2",placedAt:Date.now()-4*864e5,status:"Received",total:46,patientName:"Sam Rivera",practiceName:"Hawthorne Family Medicine",prescriberName:"Dr. Maya Ellison, MD",npi:"1234567890",notes:"",address:"418 Hawthorne Blvd, Portland, OR 97214",scripts:[],items:[
      {productId:"ldn-caps",doseId:"ldn-45",quantity:1,productName:"IsoReset Low-Dose Naltrexone",doseLabel:"4.5 mg",unitPrice:38}
    ]}
  ];
}

function home() {
  return `
    <div class="hero">
      <div>
        <p class="kicker" style="color:#c9b6e3">Practice portal · Phase 1 prototype</p>
        <h1 style="color:#fff">Doctors order. The ISOSure lab compounds.</h1>
        <p class="muted">Write the fill from the formulary, attach the script, and send it to the compounding pharmacy. Pharmacy admins manage the medication list and move incoming orders into production.</p>
        <p>
          <button class="btn mid" onclick="go('catalog')">Open the formulary</button>
          <button class="btn ghost" onclick="go('login')">Sign in as practice or pharmacy</button>
        </p>
      </div>
      <img src="brand/isosure-logo-inverse.png" alt="" style="width:min(320px,100%);justify-self:end" />
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:1.2rem">
      <div class="tile" onclick="go('catalog')"><p class="kicker">Doctor / office</p><h2>Build an order</h2><p class="muted">Select a dose on each medication, then attach scripts before checkout.</p></div>
      <div class="tile" onclick="go('login')"><p class="kicker">Pharmacy admin</p><h2>Run the formulary</h2><p class="muted">Upload a custom list or add, edit, and retire compounds by hand.</p></div>
      <div class="tile" onclick="go('pharmacy')"><p class="kicker">Phase 2 ready</p><h2>Production handoff</h2><p class="muted">Orders are shaped for the future production website. Nothing ships from this prototype.</p></div>
    </div>`;
}

function catalog(params) {
  if (state.user?.role === "pharmacy") {
    return `<p class="muted">Pharmacy staff manage the list on the formulary admin screen.</p><button class="btn" onclick="go('formulary')">Open formulary admin</button>`;
  }
  const q = (params.q||"").toLowerCase();
  const category = params.category || "All";
  const list = state.products.filter(p =>
    (category==="All"||p.category===category) &&
    (!q || p.name.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q) || (p.category||"").toLowerCase().includes(q))
  );
  return `
    <p class="kicker">Formulary</p>
    <h1>Select compounds and strengths</h1>
    <p class="muted">Each row is one medication. Choose the dose with the radio buttons, then add it to the practice order.</p>
    <div class="split" style="margin-top:1rem">
      <aside class="panel pad">
        <label>Search<input value="${params.q||""}" oninput="go('catalog',{category:'${category}',q:this.value})" placeholder="estradiol, pain, thyroid…"></label>
        <label>Therapy area
          <select onchange="go('catalog',{category:this.value,q:'${params.q||""}'})">
            <option>All</option>${CATEGORIES.map(c=>`<option ${c===category?"selected":""}>${c}</option>`).join("")}
          </select>
        </label>
      </aside>
      <div class="panel" style="overflow:auto">
        <table>
          <thead><tr><th>Medication</th><th>Dose</th><th></th></tr></thead>
          <tbody>
            ${list.map(p => {
              const selected = state.selections[p.id] || p.doses[0].id;
              return `<tr>
                <td>
                  <strong>${p.name}</strong>
                  <div class="muted">${p.form} · ${p.category}</div>
                  <div class="muted">${p.summary}</div>
                </td>
                <td>
                  <div class="doses">
                    ${p.doses.map(d => `<label><input type="radio" name="dose-${p.id}" ${d.id===selected?"checked":""} onchange="selectDose('${p.id}','${d.id}')"> ${d.label} · ${money(d.price)}</label>`).join("")}
                  </div>
                </td>
                <td><button class="btn" onclick="addLine('${p.id}'); this.textContent='Added';">Add</button></td>
              </tr>`;
            }).join("") || `<tr><td colspan="3" class="muted">No medications match those filters.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

function cart() {
  const total = cartTotal();
  const ship = total>=75 || !total ? 0 : 8;
  if (!state.cart.length) return `<p class="kicker">Practice order</p><h1>No compounds selected</h1><button class="btn" onclick="go('catalog')">Browse the formulary</button>`;
  return `
    <p class="kicker">Practice order</p>
    <h1>Review strengths</h1>
    ${state.cart.map((item,idx)=>{
      const p=product(item.productId); const d=doseOf(p,item.doseId);
      return `<div class="panel pad row" style="margin:.6rem 0">
        <div><strong>${p.name}</strong><div class="muted">${d.label} · ${p.form}</div></div>
        <div class="row">
          <div class="qty">
            <button onclick="state.cart[${idx}].quantity=Math.max(1,state.cart[${idx}].quantity-1);save();route()">−</button>
            <span>${item.quantity}</span>
            <button onclick="state.cart[${idx}].quantity++;save();route()">+</button>
          </div>
          <span>${money(d.price*item.quantity)}</span>
          <button class="btn ghost" onclick="state.cart.splice(${idx},1);save();route()">Remove</button>
        </div>
      </div>`;
    }).join("")}
    <div class="panel pad">
      <p class="row"><span>Subtotal</span><span>${money(total)}</span></p>
      <p class="row"><span>Shipping</span><span>${ship?money(ship):"Waived at $75"}</span></p>
      <p class="row"><strong>Total</strong><strong>${money(total+ship)}</strong></p>
      <button class="btn" style="width:100%" onclick="go('checkout')">Continue — attach scripts</button>
    </div>`;
}

function checkout() {
  if (!state.cart.length) return `<h1>Nothing to send</h1><button class="btn" onclick="go('catalog')">Return to formulary</button>`;
  if (state.user?.role === "pharmacy") return `<h1>Pharmacy accounts review orders; they do not place them.</h1>`;
  if (!state.user) return `<h1>Sign in as a practice first</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  const u = state.user;
  return `
    <p class="kicker">Send to compounding</p>
    <h1>Upload scripts, then complete the order</h1>
    <p class="muted">A prescription image or PDF is required before the lab will accept the order. Files stay in this browser until Phase 2.</p>
    <form class="split checkout" onsubmit="return placeOrder(event)">
      <div class="grid">
        <div class="panel pad grid">
          <strong>Prescriber</strong>
          <p>${u.prescriberName} · ${u.practiceName}<br><span class="muted">NPI ${u.npi || "—"} · DEA ${u.dea || "—"}</span></p>
          <label>Patient name <input name="patientName" required placeholder="Patient the script is written for"></label>
          <label>Patient date of birth <input name="patientDob" type="date" required></label>
        </div>
        <div class="panel pad grid">
          <strong>Ship / deliver to</strong>
          <input name="line1" required placeholder="Street address">
          <div class="grid" style="grid-template-columns:1fr 80px 110px">
            <input name="city" required placeholder="City">
            <input name="st" required placeholder="State">
            <input name="zip" required placeholder="ZIP">
          </div>
          <textarea name="notes" rows="3" placeholder="Compounding notes: flavor, allergy, match last fill"></textarea>
        </div>
        <div class="panel pad">
          <strong>Scripts</strong>
          <p class="muted">Upload one or more prescriptions (PDF, JPG, or PNG).</p>
          <div class="drop">
            <input type="file" accept=".pdf,image/*" multiple onchange="attachScripts(event)">
          </div>
          <ul id="scriptList">${scriptListHtml()}</ul>
          <p id="err" class="danger"></p>
        </div>
        <button class="btn" type="submit">Submit order to ISOSure lab</button>
      </div>
      <aside class="panel pad">
        <h2>Order summary</h2>
        ${state.cart.map(item=>{const p=product(item.productId);const d=doseOf(p,item.doseId);return `<p class="row"><span>${p.shortName}<br><span class="muted">${d.label} × ${item.quantity}</span></span><span>${money(d.price*item.quantity)}</span></p>`;}).join("")}
        <p class="row"><strong>Total</strong><strong>${money(cartTotal()+(cartTotal()>=75?0:8))}</strong></p>
      </aside>
    </form>`;
}

function scriptListHtml() {
  if (!state.scripts.length) return `<li class="muted">No scripts attached yet.</li>`;
  return state.scripts.map((s,i)=>`<li class="row"><span>${s.name} <span class="muted">(${Math.round(s.size/1024)} KB)</span></span><button type="button" class="btn ghost" onclick="state.scripts.splice(${i},1);save();document.getElementById('scriptList').innerHTML=scriptListHtml()">Remove</button></li>`).join("");
}
function attachScripts(e) {
  [...e.target.files].forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      state.scripts.push({id:crypto.randomUUID(), name:file.name, type:file.type, size:file.size, dataUrl:reader.result});
      save();
      const list = document.getElementById("scriptList");
      if (list) list.innerHTML = scriptListHtml();
    };
    reader.readAsDataURL(file);
  });
}
function placeOrder(e) {
  e.preventDefault();
  const err = document.getElementById("err");
  if (!state.scripts.length) { err.textContent = "Attach at least one script before submitting."; return false; }
  const f = e.target;
  const items = state.cart.map(item => {
    const p = product(item.productId); const d = doseOf(p,item.doseId);
    return {...item, productName:p.name, doseLabel:d.label, unitPrice:d.price};
  });
  const subtotal = items.reduce((s,i)=>s+i.unitPrice*i.quantity,0);
  const order = {
    id: crypto.randomUUID(), placedAt: Date.now(), status: "Received", items,
    total: subtotal + (subtotal>=75?0:8), notes: f.notes.value,
    patientName: f.patientName.value, patientDob: f.patientDob.value,
    practiceName: state.user.practiceName, prescriberName: state.user.prescriberName, npi: state.user.npi,
    address: `${f.line1.value}, ${f.city.value}, ${f.st.value} ${f.zip.value}`,
    scripts: state.scripts.slice()
  };
  state.orders.unshift(order);
  state.cart = [];
  state.scripts = [];
  save();
  go("order",{id:order.id});
  return false;
}

function login() {
  return `
    <p class="kicker">Access</p>
    <h1>Sign in as the practice or the pharmacy</h1>
    <div class="split checkout">
      <form class="panel pad grid" onsubmit="return signDoctor(event)">
        <strong>Doctor / office</strong>
        <input name="practiceName" required placeholder="Practice name">
        <input name="prescriberName" required placeholder="Prescriber name">
        <input name="npi" placeholder="NPI">
        <input name="dea" placeholder="DEA">
        <input name="email" type="email" required placeholder="Office email">
        <input name="phone" placeholder="Phone">
        <button class="btn" type="submit">Save practice profile</button>
        <button type="button" class="btn ghost" onclick="loadDoctor()">Use demo practice (Hawthorne Family Medicine)</button>
      </form>
      <form class="panel pad grid" onsubmit="return signPharmacy(event)">
        <strong>Compounding pharmacy admin</strong>
        <input name="pharmacyName" required placeholder="Pharmacy name" value="ISOSure Compounding Lab">
        <input name="contactName" required placeholder="Pharmacist / admin name">
        <input name="email" type="email" required placeholder="Lab email">
        <input name="phone" placeholder="Phone">
        <button class="btn mid" type="submit">Save pharmacy admin</button>
        <button type="button" class="btn ghost" onclick="loadPharmacy()">Use demo pharmacist (Jordan Hale, RPh)</button>
      </form>
    </div>`;
}
function signDoctor(e) {
  e.preventDefault();
  const f = e.target;
  state.user = {role:"doctor", practiceName:f.practiceName.value, prescriberName:f.prescriberName.value, npi:f.npi.value, dea:f.dea.value, email:f.email.value, phone:f.phone.value};
  save(); go("catalog"); return false;
}
function signPharmacy(e) {
  e.preventDefault();
  const f = e.target;
  state.user = {role:"pharmacy", pharmacyName:f.pharmacyName.value, contactName:f.contactName.value, email:f.email.value, phone:f.phone.value};
  save(); go("pharmacy"); return false;
}
function loadDoctor() {
  state.user = {role:"doctor", practiceName:"Hawthorne Family Medicine", prescriberName:"Dr. Maya Ellison, MD", npi:"1234567890", dea:"BE1234563", email:"orders@hawthornefm.example", phone:"(503) 555-0148"};
  if (!state.orders.length) state.orders = demoOrders();
  save(); go("practice");
}
function loadPharmacy() {
  state.user = {role:"pharmacy", pharmacyName:"ISOSure Compounding Lab", contactName:"Jordan Hale, RPh", email:"pharmacy@isosure.example", phone:"(800) 555-4767"};
  if (!state.orders.length) state.orders = demoOrders();
  save(); go("pharmacy");
}

function practice() {
  if (!state.user || state.user.role!=="doctor") return `<h1>Practice sign-in required</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  return `
    <div class="row">
      <div>
        <p class="kicker">Practice</p>
        <h1>${state.user.practiceName}</h1>
        <p class="muted">${state.user.prescriberName} · NPI ${state.user.npi || "—"}</p>
      </div>
      <button class="btn ghost" onclick="state.user=null;save();go('login')">Sign out</button>
    </div>
    <h2>Past orders</h2>
    ${orderCards(state.orders)}`;
}

function pharmacy() {
  if (!state.user || state.user.role!=="pharmacy") return `<h1>Pharmacy admin sign-in required</h1><button class="btn" onclick="go('login')">Sign in</button>`;
  return `
    <div class="row">
      <div>
        <p class="kicker">Pharmacy admin</p>
        <h1>Production queue</h1>
        <p class="muted">${state.user.contactName} · ${state.user.pharmacyName}. Phase 2 will send these rows to the production website.</p>
      </div>
      <div>
        <button class="btn ghost" onclick="go('formulary')">Edit formulary</button>
        <button class="btn ghost" onclick="state.user=null;save();go('login')">Sign out</button>
      </div>
    </div>
    ${orderCards(state.orders, true)}`;
}

function orderCards(orders, admin=false) {
  if (!orders.length) return `<p class="muted">No orders yet.</p>`;
  return orders.map(o => `
    <article class="panel pad" style="margin:.7rem 0">
      <div class="row">
        <div>
          <span class="chip">${o.status}</span>
          <h2 style="margin:.35rem 0 0">ISO-${o.id.slice(-6).toUpperCase()}</h2>
          <p class="muted">${new Date(o.placedAt).toLocaleDateString()} · ${o.practiceName} · Patient ${o.patientName}</p>
        </div>
        <strong>${money(o.total)}</strong>
      </div>
      ${o.items.map(i=>`<p>${i.productName} · ${i.doseLabel} × ${i.quantity}</p>`).join("")}
      ${o.scripts?.length ? `<p class="muted">${o.scripts.length} script${o.scripts.length>1?"s":""} attached</p>` : `<p class="muted">No script files on this demo order</p>`}
      ${admin ? `<label>Production status
        <select onchange="state.orders.find(x=>x.id==='${o.id}').status=this.value;save();route()">
          ${["Received","Compounding","Ready","Shipped"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
        </select>
      </label>` : ""}
      <p><a href="#order?id=${o.id}">Open ticket</a></p>
    </article>`).join("");
}

function order(params) {
  const o = state.orders.find(x => x.id===params.id);
  if (!o) return `<h1>Order not found</h1>`;
  return `
    <p class="kicker">${o.status}</p>
    <h1>Order ISO-${o.id.slice(-6).toUpperCase()}</h1>
    <p class="muted">${o.prescriberName} · ${o.practiceName} · Patient ${o.patientName}</p>
    <div class="panel pad">
      ${o.items.map(i=>`<p class="row"><span>${i.productName}<br><span class="muted">${i.doseLabel} × ${i.quantity}</span></span><span>${money(i.unitPrice*i.quantity)}</span></p>`).join("")}
      <p class="row"><strong>Total</strong><strong>${money(o.total)}</strong></p>
      <p class="muted">${o.address||""}</p>
      ${o.notes?`<p>Lab note: ${o.notes}</p>`:""}
      <h2>Scripts</h2>
      ${(o.scripts||[]).map(s=>`<p><a href="${s.dataUrl}" download="${s.name}">${s.name}</a></p>`).join("") || `<p class="muted">No files</p>`}
    </div>
    <p style="margin-top:1rem">
      <button class="btn" onclick="go(state.user?.role==='pharmacy'?'pharmacy':'practice')">Back to queue</button>
    </p>`;
}

function formulary() {
  if (state.user?.role !== "pharmacy") return `<h1>Pharmacy admin only</h1><button class="btn" onclick="go('login')">Sign in as pharmacy</button>`;
  return `
    <p class="kicker">Pharmacy admin</p>
    <h1>Medication list</h1>
    <p class="muted">Upload a CSV or JSON list, or add and edit compounds by hand. This is the list doctors order from. CSV columns: <code>name,shortName,category,form,doses,summary</code>. Doses use <code>label:price|label:price</code>.</p>
    <div class="panel pad grid" style="margin:1rem 0">
      <strong>Upload a custom list</strong>
      <input type="file" accept=".csv,.json,text/csv,application/json" onchange="importList(event)">
      <p class="muted">Upload replaces the current formulary. Keep a copy of your file.</p>
    </div>
    <form class="panel pad grid" onsubmit="return addMed(event)">
      <strong>Manually add a compound</strong>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <input name="name" required placeholder="Medication name">
        <input name="shortName" placeholder="Short name">
        <select name="category">${CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select>
        <input name="form" required placeholder="Form (Cream, Capsule…)">
      </div>
      <input name="doses" required placeholder="Doses, e.g. 50 mg:42|100 mg:52">
      <input name="summary" placeholder="Short description">
      <button class="btn" type="submit">Add to formulary</button>
    </form>
    <div class="panel" style="overflow:auto;margin-top:1rem">
      <table>
        <thead><tr><th>Medication</th><th>Doses</th><th></th></tr></thead>
        <tbody>
          ${state.products.map((p,idx)=>`<tr>
            <td><strong>${p.name}</strong><div class="muted">${p.form} · ${p.category}</div></td>
            <td>${p.doses.map(d=>`${d.label} ${money(d.price)}`).join(" · ")}</td>
            <td class="row">
              <button class="btn ghost" onclick="editMed(${idx})">Edit</button>
              <button class="btn danger" onclick="if(confirm('Remove ${p.name}?')){state.products.splice(${idx},1);save();route()}">Remove</button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function parseDoses(raw) {
  return raw.split("|").map((part,i) => {
    const [label, price] = part.split(":").map(s => s.trim());
    return {id:"d"+i+"-"+label.toLowerCase().replace(/[^a-z0-9]+/g,"-"), label: label||("Dose "+(i+1)), price: Number(price)||0};
  });
}
function addMed(e) {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  state.products.push({
    id: name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),
    name, shortName: f.shortName.value || name, category: f.category.value, form: f.form.value,
    summary: f.summary.value, doses: parseDoses(f.doses.value)
  });
  save(); route(); return false;
}
function editMed(idx) {
  const p = state.products[idx];
  const name = prompt("Medication name", p.name); if (name==null) return;
  const doses = prompt("Doses as label:price|label:price", p.doses.map(d=>d.label+":"+d.price).join("|")); if (doses==null) return;
  const summary = prompt("Summary", p.summary); if (summary==null) return;
  p.name = name; p.summary = summary; p.doses = parseDoses(doses);
  save(); route();
}
function importList(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result);
      if (file.name.endsWith(".json")) {
        const data = JSON.parse(text);
        const rows = Array.isArray(data) ? data : data.products;
        state.products = rows.map(normalizeImported);
      } else {
        state.products = parseCsv(text);
      }
      save(); route();
    } catch (err) {
      alert("Could not import that file: " + err.message);
    }
  };
  reader.readAsText(file);
}
function normalizeImported(row) {
  return {
    id: (row.id || row.name || crypto.randomUUID()).toString().toLowerCase().replace(/[^a-z0-9]+/g,"-"),
    name: row.name, shortName: row.shortName || row.name, category: row.category || "Wellness",
    form: row.form || "Capsule", summary: row.summary || "",
    doses: Array.isArray(row.doses) ? row.doses.map((d,i)=>({id:d.id||("d"+i), label:d.label, price:Number(d.price)||0})) : parseDoses(String(row.doses||"Standard:0"))
  };
}
function parseCsv(text) {
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const headers = lines[0].split(",").map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(line => {
    const cols = line.split(",").map(c=>c.trim());
    const get = (k) => cols[headers.indexOf(k)] || "";
    return normalizeImported({name:get("name"), shortName:get("shortname"), category:get("category"), form:get("form"), summary:get("summary"), doses:get("doses")});
  });
}

window.addEventListener("hashchange", route);
route();
</script>
